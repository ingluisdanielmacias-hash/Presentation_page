name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (base-href = nombre del repositorio)
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Fallback 404 y .nojekyll
        run: |
          cp dist/presentation-page/browser/index.html dist/presentation-page/browser/404.html
          touch dist/presentation-page/browser/.nojekyll

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/presentation-page/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
