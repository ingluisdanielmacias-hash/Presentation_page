<section class="xp light" aria-label="Presentación: ingeniero Full Stack">
  <div class="stage">
    <!-- Fondo: rejilla + texto gigante que se desvanece -->
    <div class="bg" aria-hidden="true">
      <span class="bg__word">&lt;/&gt;</span>
    </div>

    <!-- Panel que se expande -->
    <div class="media">
      <div class="window">
        <div class="window__bar" aria-hidden="true">
          <span></span><span></span><span></span>
          <p class="window__file">ingeniero.ts</p>
        </div>
        <pre class="code" aria-label="Resumen del perfil en forma de código"><code>@for (line of code; track $index; let i = $index) {<span class="ln" [class.on]="lineOn(i)"><span class="ln__n">{{ i + 1 }}</span>@for (tok of line; track $index) {<span [class]="tok.k ?? ''">{{ tok.t }}</span>}</span>}</code></pre>
      </div>
      <div class="shade" aria-hidden="true"></div>

      <p class="tag tag--left mono">+5 años en producción</p>
      <p class="tag tag--right mono">Desliza para expandir ↓</p>

      <p class="final mono" aria-hidden="true">Código · Equipos · Servidores · IA</p>
    </div>

    <!-- Título que se parte en dos con inversión de color -->
    <h2 class="split" aria-label="Full Stack">
      <span class="split__a" aria-hidden="true">Full</span>
      <span class="split__b" aria-hidden="true">Stack</span>
    </h2>
  </div>
</section>
