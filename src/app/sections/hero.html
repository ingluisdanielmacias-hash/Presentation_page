<section id="inicio" class="hero dark" [class.ready]="ready()">
  <div class="top">
    <p class="mono fade" style="--d: 700ms">Portafolio <span class="dim">/</span> Currículum</p>
    <p class="mono fade clock" style="--d: 800ms">
      <span class="live"></span>{{ p.location }} <span class="dim">—</span> {{ time() }}
    </p>
  </div>


  <h1 class="name" [style.translate]="'0 ' + shift() * -0.08 + 'px'">
    <span class="line"><app-split-text [text]="p.firstName" [play]="ready()" [offset]="0" /></span>
    <span class="line outline"><app-split-text [text]="p.lastName1" [play]="ready()" [offset]="5" /></span>
    <span class="line"><app-split-text [text]="p.lastName2" [play]="ready()" [offset]="9" /></span>
  </h1>

  <div class="bottom">
    <p class="role fade" style="--d: 1100ms" aria-live="polite">
      <span class="prompt">&gt;_</span>
      <span class="typed">{{ typed() }}</span><span class="caret" aria-hidden="true"></span>
    </p>

    <div class="cta fade" style="--d: 1250ms">
      <a class="btn btn--solid" href="#experiencia" (click)="go('experiencia', $event)">
        Ver trayectoria <span class="arrow">↘</span>
      </a>
      <a class="btn" [href]="p.cv" download data-cursor="PDF">
        Descargar CV <span class="arrow">↓</span>
      </a>
    </div>

    <a class="scroll fade" style="--d: 1400ms" href="#perfil" (click)="go('perfil', $event)" aria-label="Bajar a Perfil">
      <span class="mono">Scroll</span>
      <span class="track"><span></span></span>
    </a>
  </div>
</section>
