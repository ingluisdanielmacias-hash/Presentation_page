<section id="perfil" class="section light about">
  <header class="sec-head"><span class="idx">01</span>Perfil profesional</header>

  <p class="statement" #statement>
    @for (w of words; track $index) {
      <span class="w" [class.lit]="$index < lit()" [class.mark]="w.mark">{{ w.text }}</span>{{ ' ' }}
    }
  </p>

  <div class="grid">
    <div class="text">
      @for (para of p.about; track $index) {
        <p reveal [revealDelay]="$index * 120">{{ para }}</p>
      }
    </div>

    <ul class="stats">
      @for (s of stats; track s.label; let i = $index) {
        <li reveal [revealDelay]="i * 110">
          <span class="num"><app-counter [to]="s.value" [suffix]="s.suffix" /></span>
          <span class="label mono">{{ s.label }}</span>
        </li>
      }
    </ul>
  </div>
</section>
