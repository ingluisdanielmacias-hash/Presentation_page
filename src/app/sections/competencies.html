<section id="competencias" class="section dark comp">
  <header class="sec-head"><span class="idx">04</span>Competencias</header>

  <div class="layout">
    <div class="side">
      <h2 class="title">
        <span reveal="clip" class="row">Cómo</span>
        <span reveal="clip" [revealDelay]="120" class="row outline">trabajo</span>
      </h2>

      <div class="tabs" role="tablist" aria-label="Grupos de competencias" (keydown)="onKey($event)">
        @for (g of groups; track g.title; let i = $index) {
          <button
            type="button"
            role="tab"
            reveal="left"
            [revealDelay]="i * 100"
            [id]="'tab-' + i"
            [attr.aria-selected]="selected() === i"
            [attr.aria-controls]="'panel-comp'"
            [attr.tabindex]="selected() === i ? 0 : -1"
            [class.on]="selected() === i"
            (click)="selected.set(i)"
          >
            <span class="tab__n mono">{{ pad(i + 1) }}</span>
            <span class="tab__label">{{ g.title }}</span>
            <span class="tab__arrow" aria-hidden="true">→</span>
          </button>
        }
      </div>
    </div>

    <div class="panel" id="panel-comp" role="tabpanel" [attr.aria-labelledby]="'tab-' + selected()">
      @for (g of [current()]; track g.title) {
        <p class="panel__title mono">{{ g.title }} <span>— {{ pad(g.items.length) }}</span></p>
        <ol class="items">
          @for (item of g.items; track item; let j = $index) {
            <li [style.--j]="j">
              <span class="items__n mono">{{ pad(j + 1) }}</span>
              <span class="items__text">{{ item }}</span>
            </li>
          }
        </ol>
      }
    </div>
  </div>
</section>
