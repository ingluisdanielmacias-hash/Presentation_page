<section id="experiencia" class="section dark exp">
  <header class="sec-head"><span class="idx">02</span>Experiencia profesional</header>

  <h2 class="title heading">
    <span reveal="clip" class="row">Trayec<span class="outline">toria</span></span>
  </h2>

  <div class="jobs">
    @for (job of jobs; track job.period; let i = $index) {
      <article class="job" reveal>
        <div class="num" aria-hidden="true">{{ pad(i + 1) }}</div>

        <header class="head">
          <p class="mono period">{{ job.period }}</p>
          <h3 class="role">{{ job.role }}</h3>
          <p class="company">
            <span class="tag">{{ job.company }}</span>
            <span class="place">{{ job.place }}</span>
          </p>
        </header>

        <ul class="list" [class.single]="job.highlights.length === 1">
          @for (h of job.highlights; track $index) {
            <li reveal [revealDelay]="$index * 70">
              @if (h.title) {
                <strong>{{ h.title }}</strong>
              }
              <span>{{ h.text }}</span>
            </li>
          }
        </ul>
      </article>
    }
  </div>
</section>
